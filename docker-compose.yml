services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - sistema_riego_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./sistema-de-riego
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./sistema-de-riego:/app
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    build: ./sistema-de-riego
    volumes:
      - ./sistema-de-riego:/app
    command: tailwindcss -i app/static/src/input.css -o app/static/css/output.css --watch=always

volumes:
  sistema_riego_data:
